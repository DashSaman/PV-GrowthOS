<svg width="1400" height="720" viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Tahoma, sans-serif">
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-rereverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="1400" height="720" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">PV GrowthOS — Referral Lifecycle</text>
  <text x="700" y="80" text-anchor="middle" font-size="17" fill="#475569" direction="rtl">پاداش فقط پس از خرید تسویه‌شده — کلیک صرف هرگز پاداش ندارد؛ پرداخت تکراری ناممکن است</text>

  <!-- actors -->
  <rect x="40" y="110" width="200" height="90" rx="12" fill="#229ED9"/>
  <text x="140" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Referrer (A)</text>
  <text x="140" y="176" text-anchor="middle" font-size="13" fill="#e0f2fe">کد یکتا ref_&lt;code&gt;</text>

  <rect x="40" y="470" width="200" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="140" y="508" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Friend (B)</text>
  <text x="140" y="536" text-anchor="middle" font-size="13" fill="#047857">شروع ربات با دیپ‌لینک</text>

  <!-- state machine -->
  <g font-size="15">
    <rect x="330" y="470" width="250" height="90" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="455" y="505" text-anchor="middle" font-weight="700" fill="#92400e">PENDING</text>
    <text x="455" y="532" text-anchor="middle" font-size="13" fill="#b45309">ثبت در اولین start (REFERRAL_CREATED)</text>

    <rect x="660" y="470" width="250" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="785" y="505" text-anchor="middle" font-weight="700" fill="#1e40af">VALID</text>
    <text x="785" y="532" text-anchor="middle" font-size="13" fill="#1d4ed8">پس از PAYMENT_SUCCESS تسویه‌شده</text>

    <rect x="990" y="470" width="250" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <text x="1115" y="505" text-anchor="middle" font-weight="700" fill="#065f46">REWARDED</text>
    <text x="1115" y="532" text-anchor="middle" font-size="13" fill="#047857">دفتر پاداش — دقیقاً یک‌بار</text>
  </g>
  <line x1="240" y1="515" x2="325" y2="515" stroke="#475569" stroke-width="3" marker-end="url(#r1)"/>
  <line x1="580" y1="515" x2="655" y2="515" stroke="#475569" stroke-width="3" marker-end="url(#r1)"/>
  <line x1="910" y1="515" x2="985" y2="515" stroke="#059669" stroke-width="3" marker-end="url(#r3)"/>

  <!-- purchase path above states -->
  <g font-size="14">
    <rect x="330" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="455" y="330" text-anchor="middle" font-weight="700" fill="#334155">B starts bot</text>
    <text x="455" y="352" text-anchor="middle" fill="#64748b" font-size="13">تست اختیاری</text>

    <rect x="660" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="785" y="330" text-anchor="middle" font-weight="700" fill="#334155">Qualifying purchase</text>
    <text x="785" y="352" text-anchor="middle" fill="#64748b" font-size="13">فاکتور میرزا · Status=active</text>

    <rect x="990" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1115" y="330" text-anchor="middle" font-weight="700" fill="#334155">Payment settled</text>
    <text x="1115" y="352" text-anchor="middle" fill="#64748b" font-size="13">PAYMENT_SUCCESS</text>
  </g>
  <line x1="240" y1="470" x2="330" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#r1)"/>
  <line x1="580" y1="335" x2="655" y2="335" stroke="#475569" stroke-width="3" marker-end="url(#r1)"/>
  <line x1="910" y1="335" x2="985" y2="335" stroke="#475569" stroke-width="3" marker-end="url(#r1)"/>
  <path d="M 1115 370 L 1115 465" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#r3)"/>

  <!-- anti-fraud guards -->
  <rect x="330" y="110" width="910" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="785" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Anti-Fraud Guards (تست‌شده)</text>
  <g font-size="14" fill="#7f1d1d">
    <text x="360" y="175">🚫 خود‌معرفی — referrer == referred ⇒ رد</text>
    <text x="360" y="205">🔁 یک ردیف referral به ازای هر کاربر معرفی‌شده (unique) — حساب تکراری جمع می‌شود</text>
    <text x="780" y="175">⏱ سقف روزانه معرفی به ازای هر معرف (ضد فارمینگ)</text>
    <text x="780" y="205">🔑 پاداش: dedupe_key یکتا در reward_ledger — پرداخت تکراری ناممکن</text>
    <text x="360" y="235">📉 milestone ها (۱/۳/۵/۱۰) دقیقاً یک‌بار پرداخت می‌کنند · webhook تکراری = no-op</text>
  </g>

  <!-- reward box -->
  <rect x="990" y="610" width="370" height="70" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1175" y="638" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">پاداش قابل تنظیم: traffic_gb / days / credit</text>
  <text x="1175" y="660" text-anchor="middle" font-size="12.5" fill="#6d28d9">REFERRAL_ENABLED تا تأیید مالک خاموش است</text>

  <text x="700" y="700" text-anchor="middle" font-size="14" fill="#94a3b8">Partner/affiliate flows mirror this lifecycle with commission ledger (pending → approved) — پنل نمایندگی موجود بازسازی نشده است</text>
</svg>
