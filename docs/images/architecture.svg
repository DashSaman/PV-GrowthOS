    <text x="187" y="824" text-anchor="middle">robot.ahsg.top</text>
    <text x="187" y="844" text-anchor="middle" font-size="13">فروش و پروویژن اصلی</text>

    <rect x="330" y="760" width="235" height="92" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="447" y="798" text-anchor="middle" font-weight="700">PV Reseller Dashboard</text>
    <text x="447" y="824" text-anchor="middle">npanel.softarg.ir</text>
    <text x="447" y="844" text-anchor="middle" font-size="13">127.0.0.1:31080</text>

    <rect x="590" y="760" width="235" height="92" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="707" y="798" text-anchor="middle" font-weight="700">AKH Bot</text>
    <text x="707" y="824" text-anchor="middle">rasteh.softarg.ir</text>
    <text x="707" y="844" text-anchor="middle" font-size="13">127.0.0.1:8307</text>

    <rect x="850" y="760" width="235" height="92" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="967" y="798" text-anchor="middle" font-weight="700">X-UI / Xray</text>
    <text x="967" y="824" text-anchor="middle">VPN provisioning</text>
    <text x="967" y="844" text-anchor="middle" font-size="13">سرویس واقعی مشتریان</text>

    <rect x="1110" y="760" width="220" height="92" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="1220" y="798" text-anchor="middle" font-weight="700">Tunnels &amp; Net</text>
    <text x="1220" y="824" text-anchor="middle">WireGuard · GRE · SIT</text>
    <text x="1220" y="844" text-anchor="middle" font-size="13">iptables · routes</text>
  </g>

  <text x="700" y="916" text-anchor="middle" font-size="14" fill="#94a3b8">No Redis · No heavy platforms in v1 · Postgres-backed durable jobs · Small commits, feature-flag rollout</text>
