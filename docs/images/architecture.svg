<svg width="1400" height="940" viewBox="0 0 1400 940" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Tahoma, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1400" height="940" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">PV GrowthOS — Modular Monolith Architecture</text>
  <text x="700" y="80" text-anchor="middle" font-size="18" fill="#475569">معماری ماژولار؛ هر ماژول با فیچر‌فلگ مستقل قابل خاموش/روشن شدن است</text>

  <!-- telegram users -->
  <rect x="40" y="112" width="230" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="155" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Telegram Users</text>
  <text x="155" y="174" text-anchor="middle" font-size="15" fill="#475569">کاربران تلگرام</text>

  <!-- telegram cloud -->
  <rect x="330" y="112" width="250" height="84" rx="12" fill="#229ED9"/>
  <text x="455" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Telegram Bot API</text>
  <text x="455" y="174" text-anchor="middle" font-size="15" fill="#e0f2fe">عمیق‌لینک + اتریبیوشن</text>

  <line x1="270" y1="154" x2="322" y2="154" stroke="#475569" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="580" y1="154" x2="640" y2="196" stroke="#475569" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- main app container -->
  <rect x="40" y="216" width="880" height="450" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <rect x="40" y="216" width="880" height="54" rx="18" fill="#0f172a"/>
  <rect x="40" y="250" width="880" height="20" fill="#0f172a"/>
  <text x="70" y="250" font-size="20" font-weight="700" fill="#ffffff">pv-growth-app</text>
  <text x="890" y="250" text-anchor="end" font-size="15" fill="#94a3b8">127.0.0.1:8350 · docker network: pv_growth_net · ~384 MB limit</text>

  <!-- Card A: acquisition -->
  <rect x="64" y="290" width="410" height="168" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="84" y="320" font-size="18" font-weight="700" fill="#065f46">Acquisition Engine · موتور جذب</text>
  <text x="84" y="350" font-size="15" fill="#065f46">free_config — کانفیگ رایگان</text>
  <text x="84" y="375" font-size="15" fill="#065f46">config_sources — رجیستری منابع عمومی</text>
  <text x="84" y="400" font-size="15" fill="#065f46">config_quality — امتیاز و بررسی سلامت</text>
  <text x="84" y="425" font-size="15" fill="#065f46">campaigns — کمپین‌ها و برنامه زمانی</text>

  <!-- Card B: growth loops -->
  <rect x="486" y="290" width="410" height="168" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="506" y="320" font-size="18" font-weight="700" fill="#1e40af">Growth Loops · حلقه‌های فروش</text>
  <text x="506" y="350" font-size="15" fill="#1e40af">lifecycle — اتوماسیون چرخه حیات</text>
  <text x="506" y="375" font-size="15" fill="#1e40af">messaging — قالب پیام با متغیر</text>
  <text x="506" y="400" font-size="15" fill="#1e40af">referrals — معرفی و پاداش</text>
  <text x="506" y="425" font-size="15" fill="#1e40af">partners — افیلیت / نمایندگی</text>

  <!-- Card C: intelligence -->
  <rect x="64" y="474" width="410" height="172" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="84" y="504" font-size="18" font-weight="700" fill="#5b21b6">Intelligence · هوش داده</text>
  <text x="84" y="532" font-size="15" fill="#5b21b6">events — رویدادهای نرمال + idempotency</text>
  <text x="84" y="557" font-size="15" fill="#5b21b6">attribution — first-touch / last-touch</text>
  <text x="84" y="582" font-size="15" fill="#5b21b6">analytics, experiments — قیف و A/B</text>
  <text x="84" y="607" font-size="15" fill="#5b21b6">competitors, feedback, content — محتوا و رصد</text>

  <!-- Card D: core -->
  <rect x="486" y="474" width="410" height="172" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="506" y="504" font-size="18" font-weight="700" fill="#334155">Platform Core · هسته پلتفرم</text>
  <text x="506" y="532" font-size="15" fill="#334155">core, database (Alembic migrations)</text>
  <text x="506" y="557" font-size="15" fill="#334155">jobs — صف کار پایدار روی PostgreSQL</text>
  <text x="506" y="582" font-size="15" fill="#334155">telegram — ربات و کانال‌ها</text>
  <text x="506" y="607" font-size="15" fill="#334155">admin, mirza_adapter — ادمین و آداپتر</text>

  <!-- right column -->
  <rect x="960" y="216" width="400" height="118" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="980" y="248" font-size="18" font-weight="700" fill="#0369a1">PostgreSQL — db: pv_growth</text>
  <text x="980" y="276" font-size="14.5" fill="#0369a1">events · jobs · segments · referral ledger</text>
  <text x="980" y="300" font-size="14.5" fill="#0369a1">سرویس PG موجود استفاده می‌شود؛ نصب جدید ممنوع</text>
  <text x="980" y="322" font-size="14" fill="#64748b">user with least privilege · Alembic</text>

  <rect x="960" y="360" width="400" height="118" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="980" y="390" font-size="18" font-weight="700" fill="#92400e">Mirza — Source of Truth</text>
  <text x="980" y="416" font-size="14.5" fill="#92400e">orders · payments · provisioning · renewal</text>
  <text x="980" y="440" font-size="14.5" fill="#92400e">منبع حقیقت فروش و سرویس‌دهی</text>
  <text x="980" y="464" font-size="14" fill="#64748b">read-only / additive adapter only</text>

  <rect x="960" y="504" width="400" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="980" y="534" font-size="17" font-weight="700" fill="#334155">Feature Flags</text>
  <text x="980" y="560" font-size="14" fill="#475569">ATTRIBUTION · FREE_CONFIG · LIFECYCLE ·</text>
  <text x="980" y="582" font-size="14" fill="#475569">REFERRAL · PARTNER · CONTENT · EXPERIMENTS</text>

  <line x1="920" y1="275" x2="952" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="952" y1="275" x2="958" y2="275" stroke="#475569" stroke-width="0"/>
  <line x1="920" y1="419" x2="952" y2="419" stroke="#475569" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- protected strip -->
  <rect x="40" y="700" width="1320" height="180" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="700" y="736" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">PROTECTED PRODUCTION — READ ONLY · سرویس‌های محافظت‌شده؛ هرگز دست‌نخورده</text>
  <g font-size="15" fill="#7f1d1d">
