    <line x1="430" y1="185" x2="438" y2="185" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="630" y1="185" x2="638" y2="185" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="830" y1="185" x2="838" y2="185" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="1030" y1="185" x2="1038" y2="185" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <!-- connector down -->
    <path d="M 1135 240 L 1135 285 L 1135 295" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
  </g>

  <!-- Row 2: stages 7-12 -->
