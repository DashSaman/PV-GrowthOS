    <text x="135" y="168" text-anchor="middle" font-size="15" fill="#d1fae5" font-weight="600">STEP 1</text>
    <text x="135" y="196" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Acquisition</text>
    <text x="135" y="224" text-anchor="middle" font-size="16" fill="#ecfdf5">جذب کاربر</text>

    <rect x="240" y="130" width="190" height="110" rx="14" fill="url(#g1)"/>
    <text x="335" y="168" text-anchor="middle" font-size="15" fill="#d1fae5" font-weight="600">STEP 2</text>
    <text x="335" y="196" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Bot Start</text>
    <text x="335" y="224" text-anchor="middle" font-size="16" fill="#ecfdf5">شروع ربات</text>

    <rect x="440" y="130" width="190" height="110" rx="14" fill="url(#g1)"/>
    <text x="535" y="168" text-anchor="middle" font-size="15" fill="#d1fae5" font-weight="600">STEP 3</text>
    <text x="535" y="192" text-anchor="middle" font-size="18" fill="#ffffff" font-weight="700">Free Config / Trial</text>
    <text x="535" y="222" text-anchor="middle" font-size="16" fill="#ecfdf5">کانفیگ رایگان / تست</text>

    <rect x="640" y="130" width="190" height="110" rx="14" fill="url(#g1)"/>
    <text x="735" y="168" text-anchor="middle" font-size="15" fill="#d1fae5" font-weight="600">STEP 4</text>
    <text x="735" y="196" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Connection</text>
    <text x="735" y="224" text-anchor="middle" font-size="16" fill="#ecfdf5">اتصال موفق</text>

    <rect x="840" y="130" width="190" height="110" rx="14" fill="url(#g2)"/>
    <text x="935" y="168" text-anchor="middle" font-size="15" fill="#dbeafe" font-weight="600">STEP 5</text>
    <text x="935" y="196" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Pricing View</text>
