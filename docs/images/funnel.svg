    <text x="735" y="404" text-anchor="middle" font-size="16" fill="#f5f3ff">تمدید سرویس</text>

    <rect x="440" y="310" width="190" height="110" rx="14" fill="url(#g3)"/>
    <text x="535" y="348" text-anchor="middle" font-size="15" fill="#ede9fe" font-weight="600">STEP 10</text>
    <text x="535" y="376" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Referral</text>
    <text x="535" y="404" text-anchor="middle" font-size="16" fill="#f5f3ff">معرفی دوستان</text>

    <rect x="240" y="310" width="190" height="110" rx="14" fill="url(#g3)"/>
    <text x="335" y="348" text-anchor="middle" font-size="15" fill="#ede9fe" font-weight="600">STEP 11</text>
    <text x="335" y="372" text-anchor="middle" font-size="18" fill="#ffffff" font-weight="700">Affiliate / Reseller</text>
    <text x="335" y="404" text-anchor="middle" font-size="16" fill="#f5f3ff">همکاری / نمایندگی</text>

    <rect x="40" y="310" width="190" height="110" rx="14" fill="url(#g3)"/>
    <text x="135" y="348" text-anchor="middle" font-size="15" fill="#ede9fe" font-weight="600">STEP 12</text>
    <text x="135" y="376" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Win-back</text>
    <text x="135" y="404" text-anchor="middle" font-size="16" fill="#f5f3ff">بازگشت مشتری</text>

    <line x1="1040" y1="365" x2="1032" y2="365" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="840" y1="365" x2="832" y2="365" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="640" y1="365" x2="632" y2="365" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="440" y1="365" x2="432" y2="365" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="240" y1="365" x2="232" y2="365" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
  </g>

  <!-- loops -->
  <path d="M 230 420 C 180 480, 480 480, 530 425" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="380" y="492" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="600">re-engagement loop · حلقه بازگشت و واکی-بک</text>
  <path d="M 1230 310 C 1290 240, 130 240, 105 292" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="680" y="248" text-anchor="middle" font-size="15" fill="#059669" font-weight="600">referral &amp; affiliate bring new users back to acquisition · حلقه رشد ویروسی</text>

  <text x="680" y="540" text-anchor="middle" font-size="14" fill="#94a3b8">PV GrowthOS · Autonomous Growth System for PV Network · v1.0</text>
</svg>
