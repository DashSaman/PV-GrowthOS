name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
      - run: pip install -r requirements-dev.txt
      - name: Verify production lock is in sync
        run: |
          uv pip compile requirements.txt --generate-hashes -o requirements.lock
          git diff --exit-code -- requirements.lock
      - run: ruff check src tests scripts
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    env:
      PVG_ADMIN_TOKEN: test-admin-token
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: pv_growth
          POSTGRES_PASSWORD: pv_growth
          POSTGRES_DB: pv_growth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pv_growth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - name: Run tests (${{ matrix.db }})
        env:
          TEST_DB: ${{ matrix.db }}
        run: pytest
      - name: Run machine-verifiable DoD audit (SQLite)
        if: matrix.db == 'sqlite'
        env:
          TEST_DB: sqlite
        run: python scripts/dod_audit.py
      - name: Migration 0008/head round-trip (${{ matrix.db }})
        env:
          TEST_DB: ${{ matrix.db }}
        run: |
          if [ "$TEST_DB" = "postgres" ]; then
            export PVG_DATABASE_URL="postgresql+psycopg://pv_growth:pv_growth@localhost:5432/pv_growth_test"
          else
            export PVG_DATABASE_URL="sqlite+pysqlite:///./mig_test.db"
          fi
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade 0008
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade 0008
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current | grep '0012 (head)'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.lock --strict

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build commit-addressed image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pv-growth-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke image import
        run: docker run --rm pv-growth-app:${{ github.sha }} python -c "import pv_growth"
      - name: Export immutable image and checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp scripts/backup.sh dist/backup.sh
          docker save pv-growth-app:${{ github.sha }} -o dist/pv-growth-app-${{ github.sha }}.tar
          (cd dist && sha256sum pv-growth-app-${{ github.sha }}.tar > pv-growth-app-${{ github.sha }}.tar.sha256)
      - name: Upload production image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pv-growth-app-${{ github.sha }}
          path: |
            dist/pv-growth-app-${{ github.sha }}.tar
            dist/pv-growth-app-${{ github.sha }}.tar.sha256
            dist/backup.sh
          if-no-files-found: error
          retention-days: 14
